# Simple Radio 원격 제어 브로커 (Mosquitto 2) — DSM Container Manager 프로젝트 "sr-mqtt"
# 외부: wss://mqtt.1319.space/ → DSM 리버스 프록시(443, WebSocket 헤더) → 127.0.0.1:18831 → 컨테이너 9001
# 설정 파일은 시작할 때마다 컨테이너 안에서 새로 만든다. 브로커는 암호문만 중계한다.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sr-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:18831:9001"
    environment:
      MQTT_USER: "simpleradio"
      # ▼▼▼ 비밀번호는 바로 아래 줄의 따옴표 "" 사이에만 붙여넣으세요 (이 파일의 다른 곳은 고치지 않음) ▼▼▼
      MQTT_PASSWORD: ""
      # ▲▲▲ 비어 있으면 브로커는 시작하지 않고 대기합니다 ▲▲▲
    volumes:
      - sr_mqtt_data:/mosquitto/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$MQTT_PASSWORD" ]; then
          echo "비밀번호가 비어 있어 대기합니다. environment의 MQTT_PASSWORD 따옴표 안에 넣으세요."
          exec sleep 2147483647
        fi
        set -e
        mkdir -p /mosquitto/config /mosquitto/data
        cat > /mosquitto/config/mosquitto.conf <<'CONF'
        persistence true
        persistence_location /mosquitto/data/
        log_dest stdout
        log_type error
        log_type warning
        log_type notice
        connection_messages true
        allow_anonymous false
        password_file /mosquitto/config/passwd
        acl_file /mosquitto/config/acl
        max_keepalive 120
        max_packet_size 65536
        listener 9001
        protocol websockets
        max_connections 50
        CONF
        printf 'pattern readwrite sr/#\n' > /mosquitto/config/acl
        rm -f /mosquitto/config/passwd
        mosquitto_passwd -b -c /mosquitto/config/passwd "$$MQTT_USER" "$$MQTT_PASSWORD"
        chown mosquitto:mosquitto /mosquitto/config/passwd /mosquitto/config/acl /mosquitto/data
        chmod 0700 /mosquitto/config/passwd /mosquitto/config/acl
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
volumes:
  sr_mqtt_data:
