name: Release

# 버전 태그(v<versionCode>, 예: v3)를 푸시하면 APK를 빌드해서 GitHub Release로 자동 발행한다.
# 앱 내 업데이트 확인 기능(UpdateChecker)이 이 태그 형식과 첨부된 .apk 에셋을 그대로 사용한다.
on:
  push:
    tags:
      - "v*"

# 릴리즈를 만들려면 쓰기 권한이 필요하다. 저장소의 Actions 기본 권한이 읽기 전용이면
# 이 선언 없이는 마지막 단계가 403으로 실패한다.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 디버그 빌드 대신 정식 서명된 릴리즈 빌드를 배포한다. 디버그 APK는 debuggable=true에
      # 디버그 키 서명이라 Play Protect가 사이드로드 설치 시 유해 앱으로 의심한다.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk simple-radio-${{ github.ref_name }}.apk

      # "-rc" 태그(예: v20-rc1)는 prerelease로 발행한다. 앱의 UpdateChecker는 /releases/latest를
      # 보는데 GitHub는 prerelease를 latest에서 제외하므로, 사용자 폰에 배너가 뜨지 않는
      # 안전한 테스트 빌드 채널이 된다(adb로 직접 설치해 검증한 뒤 정식 태그를 민다).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: simple-radio-${{ github.ref_name }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
