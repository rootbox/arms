# Simple Radio 원격 제어 브로커. 브로커는 암호문만 중계한다(페이로드는 앱이 AES-GCM으로 봉인).
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning

# 인증 필수. 계정은 passwd 파일로(아래 README 절차).
allow_anonymous false
password_file /mosquitto/config/passwd

# 토픽 제한: 계정별로 sr/# 만 허용.
acl_file /mosquitto/config/acl

# WebSocket — DSM 리버스 프록시(WSS 443) 뒤에 둔다.
listener 9001
protocol websockets

# LAN 점검용 TCP (compose에서 127.0.0.1에만 바인딩됨)
listener 1883
protocol mqtt

# 연결 위생
max_keepalive 120
max_connections 20
message_size_limit 65536
